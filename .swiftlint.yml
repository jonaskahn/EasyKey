# SwiftLint — keep in sync with .swiftformat
excluded:
  - build
  - .build
  - DerivedData
  - Carthage
  - Pods
  - Scripts
  - EasyKeyTests
  - EasyKeyUITests

disabled_rules:
  # `let _ =` is required in ViewBuilder for observation dependencies;
  # `_ =` produces Void and fails to compile as a View.
  - redundant_discardable_let

opt_in_rules:
  - implicit_optional_initialization

trailing_comma:
  mandatory_comma: true

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 55
    error: 65
  excluded:
    - id
    - ok
    - i
    - j
    - k
    - x
    - y

nesting:
  type_level:
    warning: 2
  function_level:
    warning: 2

line_length:
  warning: 140
  error: 200
  ignores_urls: true
  ignores_function_declarations: true
  ignores_comments: true

file_length:
  warning: 500
  error: 800

type_body_length:
  warning: 400
  error: 600

function_body_length:
  warning: 65
  error: 100

function_parameter_count:
  warning: 6
  error: 8

cyclomatic_complexity:
  warning: 15
  error: 20
