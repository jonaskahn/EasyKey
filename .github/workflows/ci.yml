name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    env:
      COVERAGE_THRESHOLD: "95"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install static-analysis tools
        run: brew install swiftformat swiftlint

      - name: Resolve SPM dependencies
        run: |
          xcodebuild \
            -project EasyKey.xcodeproj \
            -scheme EasyKeyApp \
            -resolvePackageDependencies

      - name: Check formatting
        run: swiftformat --lint .

      - name: Lint
        run: swiftlint lint

      - name: Run tests with coverage
        run: |
          xcodebuild test \
            -project EasyKey.xcodeproj \
            -scheme EasyKeyApp \
            -destination "platform=macOS" \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -resultBundlePath build/TestResults.xcresult \
            -enableCodeCoverage YES

      - name: Enforce coverage gate
        run: |
          coverage=$(xcrun xccov view --report --json build/TestResults.xcresult | jq -r '
            .targets
            | map(select(.name != "EasyKeyLoginHelper.app"))
            | { covered: (map(.coveredLines) | add), executable: (map(.executableLines) | add) }
            | .covered / .executable * 100
          ')
          printf 'Line coverage (excl. LoginHelper): %.2f%%%%\n' "$coverage"
          if awk -v c="$coverage" -v t="$COVERAGE_THRESHOLD" 'BEGIN { exit !(c >= t) }'; then
            echo "Coverage gate passed (>= ${COVERAGE_THRESHOLD}%)."
          else
            echo "Coverage gate failed: ${coverage}% < ${COVERAGE_THRESHOLD}%"
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: build/TestResults.xcresult
          retention-days: 14
