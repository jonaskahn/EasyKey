name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install static-analysis tools
        run: brew install swiftformat swiftlint

      - name: Check formatting
        run: swiftformat --lint .

      - name: Lint
        run: swiftlint lint

  test:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: unit
            filter: "-only-testing:EasyKeyTests"
          - shard: ui-1
            filter: "-only-testing:EasyKeyUITests/SettingsCoverageTests"
          - shard: ui-2
            filter: "-only-testing:EasyKeyUITests/SettingsInteractionTests"
          - shard: ui-3
            filter: "-only-testing:EasyKeyUITests/SettingsNavigationTests"
          - shard: ui-4
            filter: >-
              -only-testing:EasyKeyUITests/OnboardingCoverageTests
              -only-testing:EasyKeyUITests/SettingsAccessibilityTests
          - shard: ui-5
            filter: >-
              -only-testing:EasyKeyUITests/SettingsWorkflowTests
              -only-testing:EasyKeyUITests/EasyKeyUITests
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve SPM dependencies
        run: |
          xcodebuild \
            -project EasyKey.xcodeproj \
            -scheme EasyKeyApp \
            -resolvePackageDependencies

      - name: Run tests with coverage
        run: |
          xcodebuild test \
            -project EasyKey.xcodeproj \
            -scheme EasyKeyApp \
            -destination "platform=macOS" \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -resultBundlePath build/TestResults.xcresult \
            -enableCodeCoverage YES \
            ${{ matrix.filter }}

      - name: Upload shard result bundle
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: xcresult-${{ matrix.shard }}
          path: build/TestResults.xcresult
          retention-days: 14

  coverage:
    needs: test
    runs-on: macos-15
    env:
      COVERAGE_THRESHOLD: "90"
    steps:
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Download shard result bundles
        uses: actions/download-artifact@v5
        with:
          pattern: xcresult-*
          path: shards

      - name: Merge result bundles
        run: |
          xcrun xcresulttool merge shards/*/TestResults.xcresult \
            --output-path merged.xcresult

      - name: Enforce coverage gate
        run: |
          coverage=$(xcrun xccov view --report --json merged.xcresult | jq -r '
            .targets
            | map(select(.name != "EasyKeyLoginHelper.app"))
            | { covered: (map(.coveredLines) | add), executable: (map(.executableLines) | add) }
            | .covered / .executable * 100
          ')
          printf 'Line coverage (excl. LoginHelper): %.2f%%%%\n' "$coverage"
          if awk -v c="$coverage" -v t="$COVERAGE_THRESHOLD" 'BEGIN { exit !(c >= t) }'; then
            echo "Coverage gate passed (>= ${COVERAGE_THRESHOLD}%)."
          else
            echo "Coverage gate failed: ${coverage}% < ${COVERAGE_THRESHOLD}%"
            exit 1
          fi

      - name: Upload merged result bundle
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: merged.xcresult
          retention-days: 14
