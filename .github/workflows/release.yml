name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target.name }} DMG
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: universal
            archs: arm64 x86_64
            required_archs: arm64 x86_64
          - name: arm64
            archs: arm64
            required_archs: arm64
          - name: amd64
            archs: x86_64
            required_archs: x86_64
    steps:
      - name: Checkout tag
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Import Developer ID certificate
        env:
          APPLE_SIGN_P12_BASE64: ${{ secrets.APPLE_SIGN_P12_BASE64 }}
          APPLE_SIGN_P12_PASSWORD: ${{ secrets.APPLE_SIGN_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_SIGN_P12_BASE64" ]; then
            echo "APPLE_SIGN_P12_BASE64 is not set; run 'make update-secrets' first" >&2
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p actions "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p actions "$keychain"
          printf '%s' "$APPLE_SIGN_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_SIGN_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k actions "$keychain"
          keychains=()
          while IFS= read -r existing_keychain; do
            keychains+=("$existing_keychain")
          done < <(security list-keychains -d user | sed 's/^[[:space:]]*"//; s/"[[:space:]]*$//')
          security list-keychains -d user -s "$keychain" "${keychains[@]}"
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ && !identity { identity=$2 } END { print identity }')
          [ -n "$identity" ] || { echo "no Developer ID identity in the imported certificate" >&2; exit 1; }
          {
            echo "DEVELOPER_ID_APPLICATION=$identity"
            echo "DEVELOPMENT_TEAM=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"
          echo "imported Developer ID identity $identity"

      - name: Build, sign, and notarize ${{ matrix.target.name }} DMG
        env:
          SPARKLE_FEED_URL: ${{ vars.SPARKLE_FEED_URL }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          EASYKEY_SUPPORT_URL: ${{ vars.EASYKEY_SUPPORT_URL }}
          EASYKEY_PRIVACY_POLICY_URL: ${{ vars.EASYKEY_PRIVACY_POLICY_URL }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # REQUIRED_ARCHS is read from the environment by Scripts/verify-arch.sh
          # inside `make dmg`; it is not passed on the make command line. Do not
          # drop it from this block.
          ARCHS: ${{ matrix.target.archs }}
          REQUIRED_ARCHS: ${{ matrix.target.required_archs }}
          TARGET_NAME: ${{ matrix.target.name }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          make dmg
          built_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/export/EasyKey.app/Contents/Info.plist)
          [[ "$TAG_NAME" == "v$built_version" ]] || {
            printf 'Tag %s does not match built version %s.\n' "$TAG_NAME" "$built_version" >&2
            exit 1
          }
          if [[ "$TARGET_NAME" != "universal" ]]; then
            for dmg_path in build/EasyKey-*-universal.dmg; do
              mv "$dmg_path" "${dmg_path%-universal.dmg}-${TARGET_NAME}.dmg"
            done
          fi

      - name: Upload notarization diagnostics
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: EasyKey-${{ matrix.target.name }}-notarization
          path: build/notarization/*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v5
        with:
          name: EasyKey-${{ matrix.target.name }}-dmg
          path: build/EasyKey-*-${{ matrix.target.name }}.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          if [[ -f "$keychain" ]]; then
            security delete-keychain "$keychain"
          fi

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tag
        uses: actions/checkout@v5

      - name: Download DMG artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: EasyKey-*-dmg
          path: build/release
          merge-multiple: true

      - name: Create or update draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          for target in universal arm64 amd64; do
            [[ -s "build/release/EasyKey-${version}-${target}.dmg" ]] || {
              printf 'Missing release DMG for %s.\n' "$target" >&2
              exit 1
            }
          done
          if gh release view "$TAG_NAME" --json isDraft > release.json; then
            jq -e '.isDraft == true' release.json > /dev/null || {
              echo 'Refusing to replace assets on a published release.' >&2
              exit 1
            }
            gh release upload "$TAG_NAME" build/release/*.dmg --clobber
            exit 0
          fi
          gh release create "$TAG_NAME" build/release/*.dmg \
            --verify-tag \
            --title "$TAG_NAME" \
            --generate-notes \
            --draft
